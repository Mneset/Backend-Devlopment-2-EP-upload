name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore ep-2-Mneset.sln
      - run: dotnet build ep-2-Mneset.sln --no-restore --configuration Release
      - run: dotnet test ep-2-Mneset.sln --no-build --configuration Release --verbosity normal
